<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notepad</title>
    <link rel="stylesheet" href="styles.css"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>


</head>
<body class="bg-dark">
    <div class="container shadow-lg rounded text-center mx-auto mt-5 bg-dar mb-5 pad" style="width:400px;" id="notpad">
        <h1 class=" card-title text-center display-5 fw-bold text-light"><svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" fill="currentColor" class="bi bi-journal" viewBox="0 0 16 16">
  <path d="M3 0h10a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2v-1h1v1a1 1 0 0 0 1 1h10a1 1 0 0 0 1-1V2a1 1 0 0 0-1-1H3a1 1 0 0 0-1 1v1H1V2a2 2 0 0 1 2-2"/>
  <path d="M1 5v-.5a.5.5 0 0 1 1 0V5h.5a.5.5 0 0 1 0 1h-2a.5.5 0 0 1 0-1zm0 3v-.5a.5.5 0 0 1 1 0V8h.5a.5.5 0 0 1 0 1h-2a.5.5 0 0 1 0-1zm0 3v-.5a.5.5 0 0 1 1 0v.5h.5a.5.5 0 0 1 0 1h-2a.5.5 0 0 1 0-1z"/>
</svg> My Notepad</h1>
        <p class="card-text text-center text-light mt-3">You can write notes.</p>
       <div class="card text center bg-light p-5">
        <textarea id="note" class=" form-control mb-3" rows="4"></textarea><br>
        <button id="save" class=" btn text-center btn-outline-dark">Save</button>
        </div>
        <div class="card mt-5 bg-dark p-5 pad">
        <h2 class="mt-3 text-center text-light">Saved notes</h2>
        <div id="n" class=" pad text-center text-light"></div>
        </div>
    </div>
    
    <script src="note.js"></script>
</body>
</html>
